name: Agente Shopee
on:
  schedule:
    # UTC: 11,14,17,20,23 = 8h, 11h, 14h, 17h, 20h em Brasília
    - cron: "0 11,14,17,20,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python agent.py
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Salvar histórico
        run: |
          git config user.name "agente-shopee"
          git config user.email "agente@users.noreply.github.com"
          git add postados.json
          git diff --staged --quiet || (git commit -m "atualiza histórico" && git push)
